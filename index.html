<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Requirements</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #c8102e;
            text-align: center;
            font-size: 34px;
            margin-bottom: 36px;
            font-weight: bold;
        }
        .form-row {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            color: #222;
        }
        .required::after {
            content: " *";
            color: #c8102e;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            font-size: 15px;
            border-radius: 2px;
        }
        textarea {
            min-height: 130px;
            resize: vertical;
        }
        button {
            display: block;
            margin: 30px auto 0;
            padding: 12px 48px;
            background-color: #c8102e;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 2px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #991024;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Please submit your requirements</h1>
    <form id="reqForm" action="https://formsubmit.co/mk@ronsson.net" method="POST">
        <!-- 防垃圾蜜罐 -->
        <input type="text" name="_honey" style="display:none">
        <input type="hidden" name="_autoresponse" value="">
        <input type="hidden" name="_subject" value="客户需求表单提交">

        <div class="form-row">
            <label>Your needs</label>
            <textarea name="needs" placeholder="Dear customer, you can leave your messages here so that we can better understand your needs" required></textarea>
        </div>
        <div class="form-row">
            <label class="required">Name</label>
            <input type="text" name="name" placeholder="Please input your name" required>
        </div>
        <div class="form-row">
            <label class="required">Email</label>
            <input type="email" name="email" placeholder="Please input your email" required>
        </div>
        <div class="form-row">
            <label class="required">Company Name</label>
            <input type="text" name="company" placeholder="Please input your company name" required>
        </div>
        <div class="form-row">
            <label class="required">Mobile</label>
            <input type="text" name="mobile" placeholder="Please input your mobile" required>
        </div>
        <div class="form-row">
            <label class="required">Country/Region</label>
            <input type="text" name="country" placeholder="Please input your Country/Region" required>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
    </form>

<script>
const form = document.getElementById('reqForm');
const btn = document.getElementById('submitBtn');
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    try {
        const fd = new FormData(form);
        await fetch(form.action, {
            method: 'POST',
            body: fd,
            redirect: 'manual'
        });
        alert('✅ Submit successfully!');
        form.reset();
    } catch (err) {
        alert('❌ Submit failed, please try again later.');
    }
    btn.disabled = false;
    btn.textContent = 'Submit';
})
</script>
</body>
</html>
